<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitLog — Sem conexão</title>
<style>
    :root {
        color-scheme: light dark;
    }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        background: #fff;
        color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #121212; color: #f0f0f0; }
    }
    img {
        width: 64px;
        height: 64px;
        opacity: 0.85;
    }
    h1 {
        font-size: 1.25rem;
        margin: 0;
    }
    p {
        font-size: 0.95rem;
        color: #666;
        max-width: 320px;
        margin: 0;
    }
    @media (prefers-color-scheme: dark) {
        p { color: #aaa; }
    }
    button {
        margin-top: 8px;
        padding: 10px 24px;
        border-radius: 8px;
        border: none;
        background: #2563eb;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
    }
    button:active {
        opacity: 0.85;
    }
</style>
</head>
<body>
    <img src="/static/icons/icon-192.png" alt="FitLog" onerror="this.style.display='none'">
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar essa página. Assim que a internet voltar, é só tentar de novo.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
</body>
</html>

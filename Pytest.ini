[pytest]
testpaths = tests

# Roda com cobertura por padrão (equivalente a sempre passar --cov=.).
# Relatório no terminal mostra as linhas que faltam cobrir; --cov-report=html
# pode ser adicionado manualmente quando quiser navegar por arquivo.
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-config=.coveragerc

filterwarnings =
    ignore::DeprecationWarning:flask_caching.*
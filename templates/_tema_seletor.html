{#- C2 (lote 6e): seletor de tema, no menu do avatar. O comportamento
    fica em static/js/tema.js ([data-tema-opcao]); o estado marcado
    (is-ativo/aria-checked) vem do tema.js, que lê a preferência guardada
    no aparelho ("sistema" segue o claro/escuro do aparelho). -#}
<div class="tema-seletor" role="radiogroup" aria-label="Tema do app">
    <button type="button" class="tema-opcao" role="radio" aria-checked="false" data-tema-opcao="sistema">
        <i class="bi bi-circle-half" aria-hidden="true"></i><span>System</span>
    </button>
    <button type="button" class="tema-opcao" role="radio" aria-checked="false" data-tema-opcao="escuro">
        <i class="bi bi-moon-stars" aria-hidden="true"></i><span>Dark</span>
    </button>
    <button type="button" class="tema-opcao" role="radio" aria-checked="false" data-tema-opcao="claro">
        <i class="bi bi-sun" aria-hidden="true"></i><span>Light</span>
    </button>
</div>

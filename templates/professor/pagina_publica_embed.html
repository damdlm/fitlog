<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ nome_exibicao }} — FitLog</title>
    <link rel="stylesheet" href="{{ static_v('css/professor-estilos/comum.css') }}">
    {% if estilo_info.base %}<link rel="stylesheet" href="{{ static_v(estilo_info.base) }}">{% endif %}
    <link rel="stylesheet" href="{{ static_v(estilo_info.css) }}">
    <style>
        /* Sem a navbar/chrome do base.html aqui de propósito -- essa
           página só existe pra ser embutida no iframe do modal "Ver
           minha página" (ver ProfessorRoutes.pagina_publica, ?embed=1),
           então é só o pôster puro, sem duplicar cabeçalho nenhum. */
        html, body {
            margin: 0;
            padding: 0;
        }

        /* Espaço no topo igual ao das laterais. Todos os estilos de
           pôster usam a mesma margem lateral em .pp-page (10px até
           560px de largura, 16px a partir de 561px) mas com padding-top
           zerado, então aqui o pôster encostava no topo do iframe.
           Este bloco vem depois dos CSS dos estilos, por isso vence. */
        .pp-page {
            padding-top: 10px;
        }
        @media (min-width: 561px) {
            .pp-page {
                padding-top: 16px;
            }
        }
    </style>
</head>
<body>
    {% include estilo_info.template %}

    {# Gera a imagem 1080x1920 do pôster pro botão Compartilhar do modal
       (window.ppGerarImagem, chamada pelo iframe pai). #}
    {# Mantém o pôster exatamente em 9:16 (reduz o conteúdo se não couber). #}
    <script src="{{ static_v('js/professor-pagina-ajuste.js') }}"></script>
    <script src="{{ static_v('vendor/html-to-image/html-to-image.js') }}"></script>
    <script src="{{ static_v('js/professor-pagina-imagem.js') }}"></script>
</body>
</html>

{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
<style>
    /* Mesmo visual do cluster padrão do plugin Leaflet.markercluster
       (usado em github.com/damdlm/mach) -- cores/tamanhos oficiais,
       aplicados aqui via L.divIcon porque o FitLog agrupa no servidor
       (por área visível) em vez de no cliente, então não carregamos o
       plugin inteiro, só replicamos a aparência dele. */
    .marker-cluster {
        background-clip: padding-box;
        border-radius: 20px;
    }
    .marker-cluster div {
        width: 30px;
        height: 30px;
        margin-left: 5px;
        margin-top: 5px;
        text-align: center;
        border-radius: 15px;
        font: 12px "Helvetica Neue", Arial, Helvetica, sans-serif;
        color: #fff;
    }
    .marker-cluster span {
        line-height: 30px;
    }
    .marker-cluster-small {
        background-color: rgba(181, 226, 140, 0.6);
    }
    .marker-cluster-small div {
        background-color: rgba(110, 204, 57, 0.6);
    }
    .marker-cluster-medium {
        background-color: rgba(241, 211, 87, 0.6);
    }
    .marker-cluster-medium div {
        background-color: rgba(240, 194, 12, 0.6);
    }
    .marker-cluster-large {
        background-color: rgba(253, 156, 115, 0.6);
    }
    .marker-cluster-large div {
        background-color: rgba(241, 128, 23, 0.6);
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card">
            <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h4 class="mb-0" style="color: #F28C33;">
                    <i class="bi bi-geo-alt"></i> Professores no mapa
                </h4>
                <a href="{{ url_for('aluno.buscar_professores') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-search"></i> Buscar por nome
                </a>
            </div>
            <div class="card-body">
                <p class="text-muted mb-2">Dê zoom na sua região para ver os professores disponíveis.</p>
                <div id="msg" class="mb-2" style="min-height: 1.4em; font-size: .9em;"></div>
                <div id="mapa" style="height: 65vh; min-height: 420px; border-radius: 8px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script>
    window.FITLOG_MAPA_CSRF_TOKEN = "{{ csrf_token() }}";
    window.FITLOG_MAPA_URL_SOLICITACAO = "{{ url_for('aluno.enviar_solicitacao', professor_id=0) }}";
</script>
<script src="{{ url_for('static', filename='js/mapa_professores.js') }}?v=3"></script>
{% endblock %}

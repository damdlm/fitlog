<!-- Modal Editar Treino -->
<div class="modal fade" id="modalEditarTreino" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="border: none; border-radius: 18px; overflow: hidden; box-shadow: var(--card-shadow);">
            <div class="modal-header" style="background: var(--primary-gradient); color: white; border: none;">
                <h5 class="modal-title">
                    <i class="bi bi-pencil-square"></i> Editar Treino
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form action="{{ url_for('admin.editar_treino') }}" method="post" id="formEditarTreino">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="modal-body p-4">
                    <input type="hidden" name="id_original" id="edit_treino_id_original">

                    <div class="row g-3 mb-1">
                        <div class="col-auto">
                            <label class="met-field-label">Código</label>
                            <div class="position-relative">
                                <input type="text" name="id" id="edit_treino_id" class="form-control met-codigo-input"
                                       maxlength="1" pattern="[A-Za-z]" required autocomplete="off">
                                <span class="met-checking-spinner spinner-border spinner-border-sm text-muted" id="edit_treino_checking"></span>
                            </div>
                            <small class="text-muted">1 letra</small>
                        </div>
                        <div class="col">
                            <label class="met-field-label">Nome do Treino</label>
                            <input type="text" name="nome" id="edit_treino_nome" class="form-control" required>
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="met-field-label">Descrição</label>
                        <input type="text" name="descricao" id="edit_treino_descricao" class="form-control" required>
                    </div>

                    <div class="alert alert-warning d-flex align-items-center gap-2 mt-3 mb-0" id="edit_treino_alerta" style="display: none;">
                        <i class="bi bi-exclamation-triangle"></i>
                        <span id="edit_treino_mensagem"></span>
                    </div>
                </div>
                <div class="modal-footer" style="border: none; padding: 16px 24px 24px;">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn met-btn-save" id="edit_treino_btn_salvar">
                        <i class="bi bi-save"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .met-field-label {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9a9a9a;
        margin-bottom: 6px;
        display: block;
    }
    .met-codigo-input {
        width: 72px;
        text-align: center;
        font-weight: 800;
        font-size: 1.1rem;
        text-transform: uppercase;
        padding-right: 28px;
    }
    .met-checking-spinner {
        display: none;
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 14px;
    }
    .met-checking-spinner.is-active { display: inline-block; }
    .met-btn-save {
        background: var(--primary-gradient);
        color: #fff;
        border: none;
        box-shadow: 0 4px 14px rgba(242, 140, 51, .3);
    }
    .met-btn-save:hover { color: #fff; filter: brightness(1.03); }
    .met-btn-save:disabled { opacity: .6; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const editTreinoId = document.getElementById('edit_treino_id');
    const checkingSpinner = document.getElementById('edit_treino_checking');
    const btnSalvar = document.getElementById('edit_treino_btn_salvar');
    let idEmConflito = false;
    let debounceTimer = null;

    if (editTreinoId) {
        editTreinoId.addEventListener('input', function() {
            const novoId = this.value.toUpperCase();
            const idOriginal = document.getElementById('edit_treino_id_original').value;
            const alertaDiv = document.getElementById('edit_treino_alerta');
            const mensagemSpan = document.getElementById('edit_treino_mensagem');

            this.value = novoId;
            clearTimeout(debounceTimer);

            if (novoId === idOriginal || !novoId || novoId.length === 0) {
                alertaDiv.style.display = 'none';
                checkingSpinner.classList.remove('is-active');
                idEmConflito = false;
                btnSalvar.disabled = false;
                return;
            }

            checkingSpinner.classList.add('is-active');

            // Pequeno debounce -- evita disparar uma request a cada tecla
            debounceTimer = setTimeout(function () {
                fetch(`/api/verificar-treino?id=${encodeURIComponent(novoId)}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.existe) {
                            mensagemSpan.textContent = `O ID "${novoId}" já está em uso por outro treino.`;
                            alertaDiv.className = 'alert alert-warning d-flex align-items-center gap-2 mt-3 mb-0';
                            alertaDiv.style.display = 'flex';
                            idEmConflito = true;
                        } else {
                            alertaDiv.style.display = 'none';
                            idEmConflito = false;
                        }
                        btnSalvar.disabled = idEmConflito;
                    })
                    .catch(error => {
                        console.error('Erro ao verificar treino:', error);
                        mensagemSpan.textContent = 'Não foi possível verificar a disponibilidade do ID. Você ainda pode tentar salvar.';
                        alertaDiv.className = 'alert alert-secondary d-flex align-items-center gap-2 mt-3 mb-0';
                        alertaDiv.style.display = 'flex';
                        idEmConflito = false;
                        btnSalvar.disabled = false;
                    })
                    .finally(function () {
                        checkingSpinner.classList.remove('is-active');
                    });
            }, 350);
        });
    }

    // Reset ao abrir o modal de novo (evita estado de conflito "grudado")
    document.getElementById('modalEditarTreino')?.addEventListener('show.bs.modal', function () {
        document.getElementById('edit_treino_alerta').style.display = 'none';
        checkingSpinner.classList.remove('is-active');
        idEmConflito = false;
        btnSalvar.disabled = false;
    });
});
</script>

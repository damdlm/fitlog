[pytest]
testpaths = tests

# Roda com cobertura por padrão (equivalente a sempre passar --cov=.).
# Relatório no terminal mostra as linhas que faltam cobrir; --cov-report=html
# pode ser adicionado manualmente quando quiser navegar por arquivo.
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-config=.coveragerc

filterwarnings =
    ignore::DeprecationWarning:flask_caching.*

markers =
    lgpd_aceite: mantém ativa a checagem real de reaceite de Termos/
        Política (app.py:_exigir_aceite_lgpd_atual) -- por padrão os
        outros testes usam um bypass (ver tests/conftest.py) porque
        criam usuários direto no banco, sem passar por auth.register.
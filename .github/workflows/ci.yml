name: CI

# Roda em todo push e Pull Request pra main -- pega erro antes de
# chegar no Railway, que builda direto da main (ligue "Wait for CI" no
# serviço no Railway para o deploy esperar este CI passar).
# Não precisa de Postgres/Redis reais: os testes usam SQLite em
# memória (ver tests/conftest.py) e as extensões (cache, rate limiter)
# caem pra modo em-memória sozinhas quando REDIS_URL não está setada
# (ver config.py) -- por isso não tem nenhum "services:" aqui.
#
# A suíte inteira leva ~17 min em série. Por isso os testes rodam em
# jobs paralelos, cada um no seu runner: unit (2 partes), security,
# integration (3 partes) e o "resto". As partes saem de PYTEST_PARTE="i/n"
# (ver tests/conftest.py: divisão estável por arquivo; a soma das partes é
# sempre o grupo inteiro). O tempo total cai para o da parte mais lenta.
# Não use pytest-xdist (-n) aqui: estes runners têm 1 CPU, e com 1 worker
# o job fica MAIS lento (medido: integration 11,9 -> 14 min). O lint é um job à parte, rápido. Um job final
# ("cobertura") junta os dados de todos os grupos e exige a cobertura mínima.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Necessária só pra config.py não falhar durante o import; os
  # testes em si usam SQLite em memória, não essa SECRET_KEY.
  SECRET_KEY: ci-only-secret-key-not-for-production
  FLASK_ENV: testing

jobs:
  lint:
    # Runner fixo (não ubuntu-latest): o ubuntu-latest passou para o 26.04,
    # que não tem build do Python 3.12.8 -- a versão da produção
    # (runtime.txt). Ao subir o Python do projeto, pode voltar ao latest.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Instalar dependências do sistema (libpq para psycopg2)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: |
          # E9/F63/F7/F82: erros de sintaxe e imports/nomes quebrados
          # nunca podem passar -- essa linha FALHA o build.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # O resto do flake8 (estilo) só gera aviso, não quebra o build --
          # o projeto nunca rodou lint de estilo em CI antes, então é
          # provável que haja avisos acumulados que não são culpa do PR
          # atual.
          flake8 . --count --exit-zero --max-line-length=120 --statistics

  testes:
    runs-on: ubuntu-24.04
    strategy:
      # Um grupo falhar não cancela os outros: o resultado mostra tudo de uma vez.
      fail-fast: false
      matrix:
        include:
          - nome: unit-1
            caminho: tests/unit
            parte: "0/2"
          - nome: unit-2
            caminho: tests/unit
            parte: "1/2"
          - nome: security
            caminho: tests/security
          - nome: integration-1
            caminho: tests/integration
            parte: "0/3"
          - nome: integration-2
            caminho: tests/integration
            parte: "1/3"
          - nome: integration-3
            caminho: tests/integration
            parte: "2/3"
          # "resto": tudo que NÃO está nas 3 pastas acima (hoje, os testes
          # soltos em tests/ como test_contato.py e test_privacidade.py, e
          # qualquer pasta ou arquivo novo) -- senão eles nunca rodariam.
          - nome: resto
            caminho: tests --ignore=tests/unit --ignore=tests/security --ignore=tests/integration

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Instalar dependências do sistema (libpq para psycopg2)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar testes (${{ matrix.nome }}) com cobertura
        # Cada grupo grava seus dados num arquivo próprio; o job "cobertura"
        # (abaixo) junta os 4 e confere o mínimo -- cobrar o mínimo aqui, em
        # cada grupo isolado, falharia, pois cada um cobre só uma parte.
        env:
          COVERAGE_FILE: cov-${{ matrix.nome }}
          PYTEST_PARTE: ${{ matrix.parte }}
        run: pytest ${{ matrix.caminho }} --cov-report=xml

      - name: Publicar relatório de cobertura como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.nome }}
          path: coverage.xml

      - name: Publicar dados de cobertura (para o job que junta os grupos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cov-data-${{ matrix.nome }}
          path: cov-${{ matrix.nome }}
          if-no-files-found: error

  cobertura:
    # Junta a cobertura de todos os grupos/partes e falha se o total cair
    # abaixo do mínimo -- protege o ganho de cobertura contra regressões.
    needs: testes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Instalar coverage
        run: pip install coverage==7.6.10

      - name: Baixar dados de cobertura de todos os grupos
        uses: actions/download-artifact@v4
        with:
          pattern: cov-data-*
          merge-multiple: true

      - name: Juntar e conferir cobertura mínima
        run: |
          # Todos os grupos e partes (cov-unit-1, cov-integration-3...): o
          # padrão evita esquecer um arquivo quando a matriz mudar.
          coverage combine cov-*
          coverage report --fail-under=85
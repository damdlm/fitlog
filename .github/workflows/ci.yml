name: CI

# Roda em todo push e Pull Request pra main -- pega erro antes de
# chegar no Railway, que builda direto da main sem nenhuma checagem
# hoje. Não precisa de Postgres/Redis reais: os testes usam SQLite em
# memória (ver tests/conftest.py) e as extensões (cache, rate limiter)
# caem pra modo em-memória sozinhas quando REDIS_URL não está setada
# (ver config.py) -- por isso não tem nenhum "services:" aqui.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes com cobertura
        run: pytest

  lint:
    name: Lint (flake8 + mypy)
    runs-on: ubuntu-latest
    # Não bloqueia PR/merge -- o projeto nunca rodou lint em CI antes
    # de hoje, então é provável que existam avisos acumulados que não
    # são culpa do PR atual. Fica visível no resumo do PR pra ir sendo
    # limpo aos poucos, sem travar todo mundo agora. Trocar pra
    # bloqueante (removendo os "continue-on-error") quando o código já
    # estiver limpo o suficiente.
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: flake8
        run: flake8 .
        continue-on-error: true

      - name: mypy
        run: mypy .
        continue-on-error: true
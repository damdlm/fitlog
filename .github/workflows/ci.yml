name: CI

# Roda em todo push e Pull Request pra main -- pega erro antes de
# chegar no Railway, que builda direto da main sem nenhuma checagem.
# Não precisa de Postgres/Redis reais: os testes usam SQLite em
# memória (ver tests/conftest.py) e as extensões (cache, rate limiter)
# caem pra modo em-memória sozinhas quando REDIS_URL não está setada
# (ver config.py) -- por isso não tem nenhum "services:" aqui.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      # Necessária só pra config.py não falhar durante o import; os
      # testes em si usam SQLite em memória, não essa SECRET_KEY.
      SECRET_KEY: ci-only-secret-key-not-for-production
      FLASK_ENV: testing

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip

      - name: Instalar dependências do sistema (libpq para psycopg2)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          # E9/F63/F7/F82: erros de sintaxe e imports/nomes quebrados
          # nunca podem passar -- essa linha FALHA o build.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # O resto do flake8 (estilo) só gera aviso, não quebra o build --
          # o projeto nunca rodou lint de estilo em CI antes, então é
          # provável que haja avisos acumulados que não são culpa do PR
          # atual.
          flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Rodar testes com cobertura
        run: pytest --cov-report=xml

      - name: Publicar relatório de cobertura como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml